<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refs Pane</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --bg: var(--background, #1e1e1e);
      --fg: var(--foreground, #cccccc);
      --border: var(--border-color, rgba(128, 128, 128, 0.25));
      --accent: var(--accent-color, #007acc);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-hover: rgba(255, 255, 255, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-family);
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .status {
      font-size: 11px;
      opacity: 0.6;
    }
    .search-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    input {
      flex: 1;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--fg);
      outline: none;
      font-size: 12px;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--fg);
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: var(--card-hover); }
    .content {
      display: flex;
      flex: 1;
      gap: 12px;
      min-height: 0;
    }
    .item-list {
      flex: 0 0 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-right: 1px solid var(--border);
      padding-right: 8px;
    }
    .item {
      padding: 8px;
      border-radius: 4px;
      background: var(--card-bg);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .item:hover { background: var(--card-hover); }
    .item.active {
      border-color: var(--accent);
      background: var(--card-hover);
    }
    .item-id {
      font-weight: bold;
      color: var(--accent);
      font-size: 12px;
    }
    .item-path {
      font-size: 10px;
      opacity: 0.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-detail {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: var(--card-bg);
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .detail-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      opacity: 0.5;
      font-style: italic;
    }
    .detail-header {
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .detail-id {
      color: var(--accent);
      font-size: 15px;
    }
    .detail-path {
      opacity: 0.6;
      font-size: 11px;
      margin-left: 8px;
    }
    .markdown-body {
      font-size: 13px;
      line-height: 1.6;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--fg);
      margin-top: 14px;
      margin-bottom: 8px;
      font-weight: 600;
      line-height: 1.3;
    }
    .markdown-body h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .markdown-body h3 { font-size: 14px; }
    .markdown-body h4 { font-size: 13px; }
    .markdown-body p {
      margin: 6px 0;
    }
    .markdown-body ul, .markdown-body ol {
      margin: 6px 0;
      padding-left: 20px;
    }
    .markdown-body li {
      margin-bottom: 3px;
    }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11.5px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1px 4px;
      border-radius: 3px;
    }
    .markdown-body pre.code-block {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .markdown-body pre.code-block code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 12px;
      line-height: 1.4;
    }
    .markdown-body blockquote {
      border-left: 3px solid var(--accent);
      margin: 8px 0;
      padding: 4px 12px;
      background: var(--card-bg);
      border-radius: 0 4px 4px 0;
      opacity: 0.9;
    }
    .markdown-body .table-wrapper {
      overflow-x: auto;
      margin: 10px 0;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .markdown-body th {
      background: var(--card-hover);
      font-weight: 600;
    }
    .artifact-badge {
      display: inline-block;
      background: rgba(0, 122, 204, 0.15);
      color: var(--accent);
      border: 1px solid rgba(0, 122, 204, 0.3);
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
      font-size: 11px;
    }
    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Refs Pane</h1>
    <span class="status" id="statusText">Scanning...</span>
  </header>
  <div class="search-bar">
    <input type="text" id="queryInput" placeholder="Filter or query reference IDs (e.g. RV-1, FB-2, T-3)..." />
    <button type="button" id="refreshBtn">Refresh</button>
  </div>
  <div class="content">
    <div class="item-list" id="itemList"></div>
    <div class="item-detail" id="itemDetail">
      <div class="detail-empty">Select a reference item to view its content</div>
    </div>
  </div>

  <script>
    let currentRefs = [];
    let selectedId = null;

    async function loadRefs(filterQuery = '') {
      const statusEl = document.getElementById('statusText');
      statusEl.textContent = 'Loading...';
      try {
        let workspaceUris = [];
        if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
          workspaceUris = await window.sidecar.getWorkspaceUris();
        }
        const fetcher = window.sidecar?.fetch ? window.sidecar.fetch : fetch;
        const res = await fetcher('/api/refs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: filterQuery, workspaceUris })
        });
        if (!res.ok) throw new Error(`API returned status ${res.status}`);
        const data = await res.json();
        currentRefs = data.refs || [];
        statusEl.textContent = `${currentRefs.length} ref(s) found`;
        renderList();
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
      }
    }

    function formatPath(ref) {
      if (!ref?.file) return '';
      const clean = ref.file.replace(/\\/g, '/');
      const match = clean.match(/(?:features|docs)\/[^/]+(?:\/[^/]+)?$/);
      const short = match ? match[0] : clean.split('/').slice(-2).join('/');
      return ref.line ? `${short}:${ref.line}` : short;
    }

    function renderList() {
      const listEl = document.getElementById('itemList');
      listEl.innerHTML = '';
      if (currentRefs.length === 0) {
        listEl.innerHTML = '<div style="opacity: 0.5; padding: 8px;">No references found</div>';
        showDetail(null);
        return;
      }
      currentRefs.forEach(ref => {
        const div = document.createElement('div');
        div.className = `item${ref.id === selectedId ? ' active' : ''}`;
        div.innerHTML = `<div class="item-id">${escapeHtml(ref.id)}</div><div class="item-path">${escapeHtml(formatPath(ref))}</div>`;
        div.onclick = () => {
          selectedId = ref.id;
          renderList();
          showDetail(ref);
        };
        listEl.appendChild(div);
      });
      if (selectedId) {
        const active = currentRefs.find(r => r.id === selectedId);
        showDetail(active || currentRefs[0]);
      } else if (currentRefs.length > 0) {
        selectedId = currentRefs[0].id;
        showDetail(currentRefs[0]);
      }
    }

    function showDetail(ref) {
      const detailEl = document.getElementById('itemDetail');
      if (!ref) {
        detailEl.innerHTML = '<div class="detail-empty">Select a reference item to view its content</div>';
        return;
      }
      const bodyHtml = ref.html || `<pre>${escapeHtml(ref.text || ref.summary || '(no content)')}</pre>`;
      detailEl.innerHTML = `
        <div class="detail-header">
          <strong class="detail-id">${escapeHtml(ref.id)}</strong>
          <span class="detail-path">${escapeHtml(formatPath(ref))}</span>
        </div>
        <div class="markdown-body">${bodyHtml}</div>
      `;
    }

    function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadRefs(document.getElementById('queryInput').value);
    });
    document.getElementById('queryInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadRefs(e.target.value);
    });

    if (window.sidecar && typeof window.sidecar.onWorkspaceChange === 'function') {
      window.sidecar.onWorkspaceChange(() => loadRefs());
    }

    // Initial load
    loadRefs();
  </script>
</body>
</html>

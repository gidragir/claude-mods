name: Release Plugins

on:
  push:
    tags:
      - '*-v*'
      - '!framework-v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin name to release'
        required: true
        default: 'ref-pane'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # <mod>-v<version> tag → <mod>
      PLUGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the plugin
        run: |
          PLUGIN="${PLUGIN:-${GITHUB_REF_NAME%-v*}}"
          test -f "plugins/$PLUGIN/src/plugin.tsx" || { echo "no plugin $PLUGIN"; exit 1; }
          echo "PLUGIN=$PLUGIN" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test

      # plugins/<mod>/dist is the whole plugin for both harnesses (Claude Code + Antigravity)
      - name: Build the plugin
        run: bun packages/bifrost/src/cli/bin.ts build "plugins/$PLUGIN"

      - name: Package Plugin Tarball Asset
        run: |
          cd "plugins/$PLUGIN/dist"
          tar -czf "../../../$PLUGIN.tar.gz" .

      - name: Push to Orphan Release Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="release/$PLUGIN"

          # Stage compiled plugin files including dotfiles (.claude-plugin)
          TMP_DIR=$(mktemp -d)
          cp -a "plugins/$PLUGIN/dist/." "$TMP_DIR/"
          rm -rf "$TMP_DIR/tests" "$TMP_DIR/.claude-plugin/types"

          git checkout --orphan "$BRANCH_NAME"
          git rm -rf . 2>/dev/null || true
          # everything but .git (a bare `.[!.]*` glob would take .git with it)
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Copy plugin files directly into repository root
          cp -a "$TMP_DIR/." .
          rm -rf "$TMP_DIR"

          # Force-add dist and all files regardless of .gitignore
          git add -A -f
          git commit -m "chore(release): release $PLUGIN bundle" || echo "No changes to commit"
          git push origin "$BRANCH_NAME" --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}-bundle
          path: ${{ env.PLUGIN }}.tar.gz

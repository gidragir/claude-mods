name: Publish Bifrost Framework

on:
  push:
    tags:
      - 'framework-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Build @gidragir/bifrost
        run: |
          cd packages/bifrost
          bun run build

      # build.mjs writes a self-contained package (with its own package.json) into dist/
      - name: Configure npm auth
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > packages/bifrost/dist/.npmrc
          echo "@gidragir:registry=https://npm.pkg.github.com" >> packages/bifrost/dist/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub npm Registry
        run: |
          cd packages/bifrost/dist
          npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
